  <!-- Warm up 3D model embeds on hover/focus/tap -->
  <script>
    (function () {
      var warmed = new Set();
      function warmModel(src) {
        if (!src || warmed.has(src)) return;
        warmed.add(src);
        if (document.querySelector('iframe[src="' + src + '"]')) return;
        var frame = document.createElement("iframe");
        frame.src = src;
        frame.setAttribute("aria-hidden", "true");
        frame.tabIndex = -1;
        frame.loading = "eager";
        frame.style.position = "absolute";
        frame.style.width = "1px";
        frame.style.height = "1px";
        frame.style.opacity = "0";
        frame.style.pointerEvents = "none";
        frame.style.border = "0";
        document.body.appendChild(frame);
      }
      document.querySelectorAll("[data-model-preload]").forEach(function (el) {
        var src = el.getAttribute("data-model-preload");
        ["pointerenter", "focus", "touchstart"].forEach(function (eventName) {
          el.addEventListener(eventName, function () { warmModel(src); },
            eventName === "touchstart" ? { passive: true } : {});
        });
      });
    })();
  </script>

<script>
  window.addEventListener("scroll", function () {
    setTimeout(manage_scroll, 50); // i juat put a 05ms delat so it dotns fo xeCRT kuje vefiore
  });

  function manage_scroll() {
        const nav = document.getElementById("mainNav");
    if (window.scrollY > 50) {
      nav.classList.add("scrolled");
    } else {
      nav.classList.remove("scrolled");
    }
  }
</script>

<script>
  (function () {
    var items = document.querySelectorAll(".reveal");
    if (items.length === 0) return;
    if (!("IntersectionObserver" in window)) {
      items.forEach(function (el) { el.classList.add("in-view"); });
      return;
    }
    var observer = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("in-view");
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    items.forEach(function (el) { observer.observe(el); });
  })();
</script>
