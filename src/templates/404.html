{% extends "base.html" %}

{% block title %}404 - Page Not Found | Sunk Robotics{% endblock %}

{% block content %}
<style>
  /* 404-specific styles */
  .error-page {
    min-height: calc(100vh - 280px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: linear-gradient(180deg, #f8f9fa 0%, #e9f2f8 100%);
    overflow: hidden;
  }

  /* Canvas sits behind content but doesn't interfere with layout */
  #bubbleCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .error-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 2rem;
  }

  .error-code {
    font-family: "Raleway", sans-serif;
    font-weight: 900;
    font-size: clamp(7rem, 16vw, 13rem);
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--bars);
    margin-bottom: 0.5rem;
    text-shadow: 0 4px 12px rgba(0, 64, 128, 0.2);
  }

  .error-subtitle {
    font-family: "Raleway", sans-serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    letter-spacing: 0.06em;
    color: var(--dark-blue);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .error-message {
    font-family: "Raleway", sans-serif;
    font-weight: 400;
    font-size: 1.1rem;
    line-height: 1.8;
    color: #555;
    max-width: 480px;
    margin: 0 auto 2rem auto;
  }

  .error-message .lead {
    color: #666;
  }

  .btn-return {
    font-family: "Raleway", sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background-color: var(--bars);
    border: 2px solid var(--bars);
    color: white;
    padding: 13px 34px;
    border-radius: 8px;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 3px 12px rgba(0, 64, 128, 0.25);
  }

  .btn-return:hover {
    background-color: var(--hover-color);
    border-color: var(--hover-color);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 64, 128, 0.35);
    color: white;
    text-decoration: none;
  }

  .btn-return:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(0, 64, 128, 0.2);
  }

  @media (max-width: 767px) {
    .error-page {
      min-height: calc(100vh - 220px);
    }
    .error-content {
      padding: 2rem 1.5rem;
    }
    .btn-return {
      padding: 11px 28px;
      font-size: 0.9rem;
    }
  }
</style>

<section class="error-page">
  <canvas id="bubbleCanvas"></canvas>
  <div class="error-content">
    <h1 class="error-code">404</h1>
    <p class="error-subtitle">Page Not Found</p>
    <p class="error-message">
      <span class="lead">This page has drifted into deep water.</span><br>
      Our ROVs searched everywhere, but couldn't find it.
    </p>
    <a href="/" class="btn-return">
      <i class="bi bi-house-door-fill"></i> Return to Home
    </a>
  </div>
</section>

<script>
  // ===== BUBBLE ANIMATION (lightweight, ocean-themed) =====
  (function() {
    const canvas = document.getElementById('bubbleCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let width, height;
    let bubbles = [];
    let mouseX = -100;
    let mouseY = -100;
    let targetMouseX = -100;
    let targetMouseY = -100;

    // Ocean palette matching Sunk Robotics
    const oceanColors = [
      { r: 0, g: 119, b: 190 },   // ocean-blue
      { r: 0, g: 95, b: 141 },    // dark-blue
      { r: 166, g: 220, b: 239 }, // light-blue
      { r: 0, g: 188, b: 212 },   // accent
      { r: 0, g: 64, b: 128 },    // bars
    ];

    const BUBBLE_COUNT = 60;

    function resizeCanvas() {
      const errorPage = document.querySelector('.error-page');
      if (!errorPage) return;
      width = errorPage.offsetWidth;
      height = errorPage.offsetHeight;
      canvas.width = width;
      canvas.height = height;
      initBubbles();
    }

    function getRandomColor() {
      const c = oceanColors[Math.floor(Math.random() * oceanColors.length)];
      return c;
    }

    function initBubbles() {
      bubbles = [];
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const color = getRandomColor();
        bubbles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          baseRadius: Math.random() * 14 + 4,
          radius: Math.random() * 14 + 4,
          speedY: Math.random() * 0.35 + 0.1,
          speedX: (Math.random() - 0.5) * 0.2,
          wobbleAmp: Math.random() * 0.3 + 0.1,
          wobbleSpeed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2,
          opacity: Math.random() * 0.2 + 0.08,
          color: color,
        });
      }
    }

    function updateBubbles() {
      mouseX += (targetMouseX - mouseX) * 0.05;
      mouseY += (targetMouseY - mouseY) * 0.05;

      const time = Date.now() * 0.001;

      for (let b of bubbles) {
        b.y -= b.speedY;
        b.x += b.speedX + Math.sin(time * b.wobbleSpeed + b.phase) * b.wobbleAmp;

        // Mouse interaction
        const dx = mouseX - b.x;
        const dy = mouseY - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 160;

        if (dist < maxDist && mouseX > 0 && mouseY > 0) {
          const force = (1 - dist / maxDist);
          b.x += dx * force * 0.03;
          b.y += dy * force * 0.03;
          b.radius = b.baseRadius * (1 + force * 0.4);
        } else {
          b.radius += (b.baseRadius - b.radius) * 0.04;
        }

        b.radius = Math.max(2, Math.min(b.baseRadius * 1.8, b.radius));

        // Wrap
        if (b.y < -b.radius * 3) {
          b.y = height + b.radius * 2;
          b.x = Math.random() * width;
        }
        if (b.x < -b.radius * 2) b.x = width + b.radius;
        if (b.x > width + b.radius * 2) b.x = -b.radius;
      }
    }

    function drawBubbles() {
      ctx.clearRect(0, 0, width, height);

      for (let b of bubbles) {
        const { r, g, b: blue } = b.color;

        // Soft glow
        const glowRad = b.radius * 2;
        const glow = ctx.createRadialGradient(b.x, b.y, b.radius * 0.2, b.x, b.y, glowRad);
        glow.addColorStop(0, `rgba(${r},${g},${blue},${b.opacity * 0.5})`);
        glow.addColorStop(1, `rgba(${r},${g},${blue},0)`);

        ctx.beginPath();
        ctx.arc(b.x, b.y, glowRad, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // Body
        const body = ctx.createRadialGradient(
          b.x - b.radius * 0.25, b.y - b.radius * 0.3, b.radius * 0.05,
          b.x, b.y, b.radius
        );
        body.addColorStop(0, `rgba(255,255,255,${b.opacity * 0.5})`);
        body.addColorStop(0.4, `rgba(${r},${g},${blue},${b.opacity * 0.35})`);
        body.addColorStop(1, `rgba(${r},${g},${blue},0)`);

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = body;
        ctx.fill();

        // Shine
        const shine = ctx.createRadialGradient(
          b.x - b.radius * 0.3, b.y - b.radius * 0.35, 0,
          b.x - b.radius * 0.1, b.y - b.radius * 0.15, b.radius * 0.35
        );
        shine.addColorStop(0, 'rgba(255,255,255,0.55)');
        shine.addColorStop(1, 'rgba(255,255,255,0)');

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = shine;
        ctx.fill();
      }
    }

    function animate() {
      updateBubbles();
      drawBubbles();
      requestAnimationFrame(animate);
    }

    // Events
    window.addEventListener('resize', resizeCanvas);

    const errorPage = document.querySelector('.error-page');
    if (errorPage) {
      errorPage.addEventListener('mousemove', (e) => {
        const rect = errorPage.getBoundingClientRect();
        targetMouseX = e.clientX - rect.left;
        targetMouseY = e.clientY - rect.top;
      });

      errorPage.addEventListener('mouseleave', () => {
        targetMouseX = -200;
        targetMouseY = -200;
      });

      errorPage.addEventListener('mouseenter', (e) => {
        const rect = errorPage.getBoundingClientRect();
        targetMouseX = e.clientX - rect.left;
        targetMouseY = e.clientY - rect.top;
      });

      // Touch
      errorPage.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const rect = errorPage.getBoundingClientRect();
          targetMouseX = e.touches[0].clientX - rect.left;
          targetMouseY = e.touches[0].clientY - rect.top;
        }
      }, { passive: true });

      errorPage.addEventListener('touchend', () => {
        targetMouseX = -200;
        targetMouseY = -200;
      });
    }

    resizeCanvas();
    animate();
  })();
</script>
{% endblock %}
